# Rakshak AI Egress Guard: DHCP, DNS and time for the camera port only.
# install.sh replaces cam0 / 192.168.50.x with the real interface and range.
interface=cam0
bind-interfaces
except-interface=lo

# Cameras get an address, and the box as their router, DNS server and time server.
dhcp-range=192.168.50.100,192.168.50.199,12h
dhcp-option=option:router,192.168.50.1
dhcp-option=option:dns-server,192.168.50.1
dhcp-option=option:ntp-server,192.168.50.1

# No upstream DNS: every name resolves to nowhere, and every lookup is logged.
no-resolv
address=/#/0.0.0.0
address=/#/::
log-queries
log-facility=/var/log/rakshak/dnsmasq.log
